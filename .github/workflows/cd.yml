
# CD: build Docker image on green main, publish to GHCR, deploy staging.
name: CD build & deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

env:
  IMAGE: ghcr.io/${{ "{{ github.repository }}" }}/fraud-api

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ "{{ github.actor }}" }}
          password: ${{ "{{ secrets.GITHUB_TOKEN }}" }}   # auto-provisioned, no PATs
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ "{{ env.IMAGE }}" }}:${{ "{{ github.sha }}" }}
            ${{ "{{ env.IMAGE }}" }}:latest
          cache-from: type=gha        # layer caching: builds in seconds, not minutes
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build
    environment: staging            # GitHub Environment: requires approval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy (simulated)
        run: |
          echo "Deploying ${{ "{{ env.IMAGE }}" }}:${{ "{{ github.sha }}" }} to staging"
          echo "MODEL_VERSION=${{ "{{ github.sha }}" }} injected at container start"
