
# PR workflow: train on the PR branch and comment metrics back to the PR.
# Answers the industrial question: "will this change hurt my KPIs?" before merge.
name: PR experiment report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python data/generate_data.py
      - run: python training/train.py
      - name: Comment metrics on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('models/metrics.json', 'utf8'));
            const body = `### Experiment metrics (this PR)
            | metric | value |
            |---|---|
            | recall | ${m.recall} |
            | precision | ${m.precision} |
            | f1 | ${m.f1} |
            | roc_auc | ${m.roc_auc} |`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body });
